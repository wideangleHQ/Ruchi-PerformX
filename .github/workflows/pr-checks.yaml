name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # prisma.config.ts reads DIRECT_URL at generate time and CI has no .env, so
    # these belong to the whole job rather than to one step. None of them
    # reaches a real service: the DI graph resolves before any connection.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-placeholder-not-a-real-secret
      VMS_JWT_SECRET: ci-placeholder-not-a-real-secret
      INTERNAL_API_KEY: ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: ci@example.invalid
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_BUCKET: ci
      SUPABASE_VMS_BUCKET: ci
      ASSET_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # The assistant module refuses to boot without one, the same as
      # assets and JWT_SECRET. Never called in CI: no test reaches the API.
      OPENCODE_API_KEY: ci-placeholder-not-a-real-key
      # Free model. CI never calls it; no test reaches the network.
      ASSISTANT_MODEL: laguna-s-2.1-free
    steps:
      - uses: actions/checkout@v4
      # 22, not 20: @supabase/realtime-js needs a native WebSocket and the API
      # will not boot without one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run
      - name: App starts
        # Catches a module registering a controller without AuthModule, which
        # typechecks and passes tests and then fails at boot on JwtService.
        run: |
          npx nest build
          out=$(timeout 40 node dist/main.js 2>&1 || true)
          if echo "$out" | grep -qE "can.t resolve dependencies|UnknownDependenciesException"; then
            echo "$out" | grep -E "ERROR|resolve dependencies" | head -3
            exit 1
          fi
          # The whole output, not a tail. Nest prints the message above the
          # stack, so `tail -5` reliably showed five frames and no reason.
          echo "$out" | grep -q "Nest application successfully started" || {
            echo "$out"; exit 1; }
          echo "App starts."

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck, allowing the known baseline
        run: |
          # 41 pre-existing errors on main, see docs/src/p1_known_gaps.md.
          # This gate is "no new ones", not "zero".
          count=$(npx tsc --noEmit -p tsconfig.json 2>&1 | grep -c 'error TS' || true)
          echo "client type errors: $count (baseline 41)"
          if [ "$count" -gt 41 ]; then
            npx tsc --noEmit -p tsconfig.json 2>&1 | grep 'error TS' || true
            echo "FAIL: $count errors, up from the 41 on main."
            exit 1
          fi

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: No AI attribution
        run: just no-ai-trails
      - name: Vendor routes stay closed
        run: just vendor-roles
