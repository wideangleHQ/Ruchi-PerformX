name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck, allowing the known baseline
        run: |
          # 41 pre-existing errors on main, see docs/src/p1_known_gaps.md.
          # This gate is "no new ones", not "zero".
          count=$(npx tsc --noEmit -p tsconfig.json 2>&1 | grep -c 'error TS' || true)
          echo "client type errors: $count (baseline 41)"
          if [ "$count" -gt 41 ]; then
            npx tsc --noEmit -p tsconfig.json 2>&1 | grep 'error TS' || true
            echo "FAIL: $count errors, up from the 41 on main."
            exit 1
          fi

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: No AI attribution
        run: just no-ai-trails
      - name: Vendor routes stay closed
        run: just vendor-roles
