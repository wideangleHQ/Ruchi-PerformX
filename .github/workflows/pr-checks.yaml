name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run
      - name: Nest container builds
        # Catches a module registering a controller without AuthModule, which
        # typechecks and passes tests and then fails at boot on JwtService.
        # No database is touched; these are placeholders for the two modules
        # that read env at import time.
        run: npx ts-node --transpile-only scripts/boot-check.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-placeholder-not-a-real-secret
          VMS_JWT_SECRET: ci-placeholder-not-a-real-secret
          INTERNAL_API_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: ci@example.invalid
          SUPABASE_URL: https://ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_BUCKET: ci
          SUPABASE_VMS_BUCKET: ci

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck, allowing the known baseline
        run: |
          # 41 pre-existing errors on main, see docs/src/p1_known_gaps.md.
          # This gate is "no new ones", not "zero".
          count=$(npx tsc --noEmit -p tsconfig.json 2>&1 | grep -c 'error TS' || true)
          echo "client type errors: $count (baseline 41)"
          if [ "$count" -gt 41 ]; then
            npx tsc --noEmit -p tsconfig.json 2>&1 | grep 'error TS' || true
            echo "FAIL: $count errors, up from the 41 on main."
            exit 1
          fi

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: No AI attribution
        run: just no-ai-trails
      - name: Vendor routes stay closed
        run: just vendor-roles
