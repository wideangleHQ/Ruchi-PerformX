name: Vercel Preview Deployment

on:
  schedule:
    # 12:00 AM IST every day
    - cron: "30 18 * * *"

  workflow_dispatch:

concurrency:
  group: vercel-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      # These run from the repo root, not client. The project's Root Directory
      # on Vercel is already client, and vercel resolves that against the
      # working directory, so running from client looks for client/client and
      # fails the install step with a bare "spawn sh ENOENT". Nothing installs
      # dependencies here either, since vercel build runs the project's own
      # install command.
      - name: Pull Vercel Preview environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN"

      - name: Build Preview
        run: |
          vercel build \
            --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        run: |
          vercel deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN"