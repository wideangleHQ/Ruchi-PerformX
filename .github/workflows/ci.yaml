name: Vercel Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel Production environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build Production
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # `--archive=tgz` uploads one tarball instead of one request per file.
      # A Next.js build is thousands of small static chunks, and the free plan
      # caps uploads at 5000 a day, so a handful of deploys in one afternoon
      # exhausts the quota and every deploy then fails for 24 hours with
      # `api-upload-free`. Vercel's own error message recommends this flag.
      - name: Deploy Production
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --archive=tgz \
            --token="$VERCEL_TOKEN"
