name: Vercel Deployment

# Nothing deploys on push. A preview goes out once a day so there is always a
# recent URL to look at, and production is a button somebody presses.
# client/vercel.json sets deploymentEnabled false, so this workflow is the only
# path to a deploy.

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC, 07:30 IST

  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  # Scheduled runs have no inputs, so they fall through to preview.
  group: vercel-${{ inputs.target || 'preview' }}
  cancel-in-progress: ${{ inputs.target != 'production' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.target || 'preview' }}
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ inputs.target == 'production' && 'production' || 'preview' }}
      PROD_FLAG: ${{ inputs.target == 'production' && '--prod' || '' }}

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment="$VERCEL_ENV" \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # PROD_FLAG is empty for preview and "--prod" for production, so it has to
      # stay unquoted: quoting passes an empty argument that vercel rejects.
      - name: Build
        run: |
          # shellcheck disable=SC2086
          vercel build $PROD_FLAG \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: |
          # shellcheck disable=SC2086
          vercel deploy --prebuilt $PROD_FLAG \
            --token="${{ secrets.VERCEL_TOKEN }}"
