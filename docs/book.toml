[book]
title = "RUCHI PerformX Engineering Handbook"
authors = ["WideAngle Media & Technologies"]
description = "How PerformX is built, how to run it, and what Phase 2 has to add."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
smart-punctuation = false
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
